services:
  - type: web
    name: bitcoin-mining-admin-panel
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        sync: false  # set in the Render dashboard; never commit the value
      - key: MONGODB_URI
        sync: false  # set in the Render dashboard; never commit the value
